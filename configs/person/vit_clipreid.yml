MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'ViT-B-16'
  STRIDE_SIZE: [16, 16]
  ID_LOSS_WEIGHT : 0.25
  TRIPLET_LOSS_WEIGHT : 1.0
  I2T_LOSS_WEIGHT : 1.0
  # SIE_CAMERA: True
  # SIE_COE : 1.0

INPUT:
  SIZE_TRAIN: [128, 64]
  SIZE_TEST: [128, 64]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  STAGE1:
    IMS_PER_BATCH: 16
    OPTIMIZER_NAME: "Adam"
    BASE_LR: 0.00035
    WARMUP_LR_INIT: 0.00001
    LR_MIN: 1e-6
    WARMUP_METHOD: 'linear'
    WEIGHT_DECAY:  1e-4
    WEIGHT_DECAY_BIAS: 1e-4
    MAX_EPOCHS: 2
    CHECKPOINT_PERIOD: 30
    LOG_PERIOD: 20
    WARMUP_EPOCHS: 5
  
  STAGE2:
    IMS_PER_BATCH: 16
    OPTIMIZER_NAME: "Adam"
    BASE_LR: 0.000005
    WARMUP_METHOD: 'linear'
    WARMUP_ITERS: 10
    WARMUP_FACTOR: 0.1
    WEIGHT_DECAY:  0.0001
    WEIGHT_DECAY_BIAS: 0.0001
    LARGE_FC_LR: False
    MAX_EPOCHS: 2
    CHECKPOINT_PERIOD: 30
    LOG_PERIOD: 20
    EVAL_PERIOD: 1
    BIAS_LR_FACTOR: 2
    
    STEPS: [30, 50]
    GAMMA: 0.1
  
TEST:
  EVAL: True
  IMS_PER_BATCH: 16
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  OCCLUSION:
    ENABLED: False
    RATIOS: [0.0, 0.2, 0.4, 0.6]
  ATTENTION:
    ENABLED: True
    MAP_DIR: './datasets/attention_maps'
    MAP_SIZE: [16, 8]
    OVERLAY_ALPHA: 0.45

DATASETS:
  NAMES: ('market1501')
  ROOT_DIR: ('./datasets/data')
OUTPUT_DIR: './model/output'

I2T_TOPK:
  ENABLED: True
  NUMBER_K: 64

I2T_RANDOM_POOL:
  ENABLED: False
  # Additional random negative identities per batch; batch identities are included too.
  NUM_NEGATIVES: 256

I2T_RANDOM_K:
  # Disable I2T_TOPK when enabling Random-K.
  ENABLED: False
  NUMBER_K: 64

